[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qlbm"
version = "0.0.6"
requires-python = ">= 3.12"

classifiers = [
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]

dependencies = [
    "numpy>=2.2",
    "numpy-stl>=3.1",
    "openqarp>=0.2,<0.3",
    "typing-extensions",
    "vtk",
]
authors = [{ name = "qlbm authors" }, { email = "qcfd-EWI@tudelft.nl" }]
maintainers = [{ name = "Calin Georgescu", email = "c.a.georgescu@tudelft.nl" }]
description = "Quantum Algorithms for Lattice Boltzmann Methods."
readme = "README.md"
license = { text = "MPL-2.0" }


[project.urls]
Homepage = "https://qcfd-lab.github.io/qlbm/"


[project.optional-dependencies]
dev = [
    "mypy==1.16.1",
    "pytest",
    "pytest-cov",
    "coverage",
    "ruff>=0.9.2",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "sphinx==8.0.2",
    "pydata-sphinx-theme",
    "pyvista[jupyter]",
    "imageio",
]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinxcontrib-bibtex",
    "sphinx_autodoc_typehints",
    "sphinx_copybutton",
    "sphinx_design",
    "nbsphinx",
    "nbsphinx-link",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["qlbm", "qlbm.*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false    # False positives due to the qarpx nanobind stubs
warn_unused_configs = true
warn_unreachable = true
check_untyped_defs = true
# test/oracle/generate_*.py import the qiskit-based qlbm, whose classes share
# names but not signatures with this package.
exclude = ["^test/oracle/"]


# qarp/qarpx ship no py.typed marker; vtk and stl have no stubs.
[[tool.mypy.overrides]]
module = [
    "stl",
    "qarp.*",
    "qarpx",
    "vtk",
]
ignore_missing_imports = true

# Exclude abstract methods from coverage report
[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "D"]
extend-select = ["I"]
ignore = ["D401"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
